<div class="lab-page">
  <header class="lab-header">
    <div class="lab-eyebrow-row">
      <span class="eyebrow">{{ labCategory }}</span>
      <button
        class="btn-icon schema-btn"
        (click)="schemaOpen.update(v => !v)"
        [attr.aria-expanded]="schemaOpen()"
        aria-label="Toggle data model"
      >
        <span class="schema-icon-wrap">
          <fa-icon class="icon-db" [icon]="dbIcon" />
          <fa-icon class="icon-star" [icon]="starIcon" />
        </span>
      </button>
    </div>
    <h1>{{ labTitle }}</h1>
  </header>

  <div class="schema-inline" [class.is-open]="schemaOpen()">
    <div><app-schema-panel /></div>
  </div>

  <div class="step-shell" #stepShell>
    <app-step-nav
      [step]="step()"
      [totalSteps]="totalSteps"
      [label]="conceptName()"
      [canAdvance]="stepCleared()"
      (back)="goBack()"
      (forward)="goNext()"
    />

    <div class="step-content">
      <app-workshop-step
        [config]="currentStepConfig()"
        (advance)="onStepAdvance()"
        (retreat)="goBack()"
        (scrollToStep)="onScrollToStep()"
      />
    </div>
  </div>
</div>
