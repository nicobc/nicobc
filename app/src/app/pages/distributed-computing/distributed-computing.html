<div class="lab-page">
  <header class="lab-header">
    <div class="lab-eyebrow-row">
      <span class="eyebrow">{{ labCategory }}</span>
      <button
        class="btn-icon schema-btn"
        (click)="schemaOpen.update(v => !v)"
        [attr.aria-expanded]="schemaOpen()"
        aria-label="Toggle data model"
      >
        <span class="schema-icon-wrap">
          <fa-icon class="icon-db" [icon]="dbIcon" />
          <fa-icon class="icon-star" [icon]="starIcon" />
        </span>
      </button>
    </div>
    <h1>{{ labTitle }}</h1>
  </header>

  <div class="schema-inline" [class.is-open]="schemaOpen()">
    <div><app-schema-panel /></div>
  </div>

  <div class="step-shell" #stepShell>
    @if (step() > 1) {
    <button class="btn-ghost step-back" (click)="goBack()">&#8592;</button>
    }

    <span class="step-indicator">{{ step() }} / {{ totalSteps }} — {{ conceptName() }}</span>

    @if (step() < totalSteps && stepCleared()) {
    <button class="btn-ghost step-forward" (click)="goNext()">&#8594;</button>
    }

    <div class="step-content">
      <app-workshop-step [config]="currentStepConfig()" (advance)="onStepAdvance()" (scrollToStep)="onScrollToStep()" />
    </div>
  </div>
</div>
