<div class="lab-page">
  <header class="lab-header">
    <span class="eyebrow">{{ labCategory }}</span>
    <h1>{{ labTitle }}</h1>
  </header>

  <div class="step-shell">
    @if (step() > 1) {
    <button class="btn-ghost step-back" (click)="goBack()">&#8592;</button>
    }

    <span class="step-indicator">{{ step() }} / {{ totalSteps }} — {{ conceptName() }}</span>

    @if (step() < totalSteps && stepCleared()) {
    <button class="btn-ghost step-forward" (click)="goNext()">&#8594;</button>
    }

    <div class="step-content">
      <app-workshop-step [config]="currentStepConfig()" (advance)="onStepAdvance()" />
    </div>
  </div>
</div>
