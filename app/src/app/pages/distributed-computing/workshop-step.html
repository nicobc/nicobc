<app-substep-progression
  #sp
  [substeps]="substeps()"
  [hasPrev]="!config().isFirstStep"
  [hasNext]="!config().isFinalStep"
  (exitBack)="onExitBack()"
  (exitForward)="onTerminalAction()"
>
  @if (config().vizScenario && sp.activeIndex() === 0) {
  <app-data-movement-viz [scenario]="config().vizScenario!" (modeChange)="onModeChange($event)" />
  <div class="viz-nav">
    <button class="btn-outline btn-replay" (click)="replay()">&#8635; {{ replayLabel }}</button>
  </div>
  } @if (sp.activeIndex() === copySubstepIndex()) {
  <div class="step-copy">
    @for (para of config().paragraphs; track $index) {
    <p [innerHTML]="para"></p>
    }
  </div>
  } @if (sp.activeIndex() === challengeSubstepIndex()) {
  <div class="challenge-slide">
    <p class="challenge-intro" [innerHTML]="config().intro"></p>

    <app-sql-editor [initialValue]="config().sql()" [showActions]="false" (valueChange)="onChallengeInput($event)" />

    <div class="challenge-actions-row">
      <button class="btn-icon" (click)="restartChallenge()" aria-label="Restart challenge">&#x21BA;</button>
      <button class="btn-outline" (click)="runChallenge()" [disabled]="config().controller.checking()">
        {{ runLabel }}
      </button>
      <button class="btn-ghost" (click)="revealSolution()">{{ revealLabel }}</button>
      <button class="btn-outline" (click)="submitChallenge()" [disabled]="config().controller.checking()">
        {{ config().controller.checking() ? submittingLabel : submitLabel }}
      </button>
    </div>

    <app-query-output [feedback]="feedback" [result]="config().queryResult()" />
  </div>
  }
</app-substep-progression>
