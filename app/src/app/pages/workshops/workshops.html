<div class="lab-page">
  <header class="lab-header">
    <div class="lab-eyebrow-row">
      <span class="eyebrow">{{ eyebrow }}</span>
      <button
        class="btn-icon schema-btn"
        [class.is-pulsing]="schemaIconPulse()"
        (click)="schemaOpen.update(v => !v)"
        [attr.aria-expanded]="schemaOpen()"
        aria-label="Toggle data model"
      >
        <span class="schema-icon-wrap">
          <fa-icon class="icon-db" [icon]="dbIcon" />
          <fa-icon class="icon-star" [icon]="starIcon" />
        </span>
      </button>
    </div>
    <h1>{{ heading }}</h1>
  </header>

  <div class="scenario">
    @for (line of scenarioLines; track $index) {
    <p>{{ line }}</p>
    }
    <p>
      {{ scenario3Pre }}<button type="button" class="inline-link" (click)="highlightSchema()">
        {{ scenario3Available }}</button
      >{{ scenario3Post }}
    </p>
  </div>

  <div class="schema-inline" [class.is-open]="schemaOpen()">
    <div><app-schema-panel /></div>
  </div>

  <div class="workshop-grid">
    @for (ws of workshops; track ws.seq) {
    <a class="project-card" [routerLink]="ws.route">
      <span class="eyebrow">{{ ws.seq }}</span>
      <h2>{{ ws.title }}</h2>
      <p>{{ ws.description }}</p>
      <span class="cta">{{ exploreCta }} &rarr;</span>
    </a>
    }
  </div>

  <p class="disclaimer">{{ disclaimer }}</p>
</div>
