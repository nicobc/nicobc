<div class="lab-grid">
  @for (project of projects; track project.slug) {
    <a class="project-card" [routerLink]="project.route">
      <span class="category">{{ project.category }}</span>
      <h2>{{ project.title }}</h2>
      <p>{{ project.description }}</p>
      <span class="cta">Explore &rarr;</span>
    </a>
  }
</div>
