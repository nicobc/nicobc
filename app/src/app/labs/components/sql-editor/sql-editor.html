<div class="editor-wrapper">
  <div #editorHost class="editor-host"></div>
  <div class="editor-actions">
    <button class="btn-primary" (click)="onRun()">{{ runLabel }}</button>
    @if (solution) {
      <button class="btn-ghost" (click)="onReveal()">{{ revealLabel }}</button>
    }
  </div>
</div>
