@if (scenario === 'column-pruning') {

<div class="viz-toggle">
  <button class="toggle-pill" [class.active]="pruningMode() === 'unpruned'" (click)="setPruningMode('unpruned')">
    {{ cpToggleUnpruned }}
  </button>
  <button class="toggle-pill" [class.active]="pruningMode() === 'pruned'" (click)="setPruningMode('pruned')">
    {{ cpTogglePruned }}
  </button>
  <span class="cp-from">{{ cpFromClause }}</span>
</div>

<div
  class="stage cp-stage"
  [class.animating]="animating()"
  [class.cp-stage--unpruned]="pruningMode() === 'unpruned'"
  [class.cp-stage--pruned]="pruningMode() === 'pruned'"
>
  <div class="storage">
    <svg viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
      <g fill="currentColor" opacity="0.20">
        <ellipse cx="40" cy="9" rx="38" ry="9" />
        <rect x="2" y="9" width="76" height="72" />
        <ellipse cx="40" cy="81" rx="38" ry="9" />
      </g>
      <ellipse cx="40" cy="9" rx="38" ry="9" fill="currentColor" opacity="0.35" />
    </svg>
  </div>

  <div class="node node-1"></div>
  <div class="node node-2"></div>

  <div class="partition dim-customers pn1a"></div>
  <div class="partition dim-customers pn2a"></div>
</div>

} @if (scenario === 'predicate-pushdown') {

<div class="viz-toggle">
  <div class="pp-viz-control">
    <code class="pp-query-static">{{ ppSelectFrom }}</code>
    <button class="toggle-pill pp-where-pill" [class.active]="isFilterPushed()" (click)="togglePushdown()">
      {{ ppWhereClause }}
    </button>
  </div>
</div>

<div
  class="stage pp-stage"
  [class.animating]="animating()"
  [class.pp-stage--unpushed]="isFilterUnpushed()"
  [class.pp-stage--pushed]="isFilterPushed()"
>
  <div class="storage">
    <svg viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
      <g fill="currentColor" opacity="0.20">
        <ellipse cx="40" cy="9" rx="38" ry="9" />
        <rect x="2" y="9" width="76" height="72" />
        <ellipse cx="40" cy="81" rx="38" ry="9" />
      </g>
      <ellipse cx="40" cy="9" rx="38" ry="9" fill="currentColor" opacity="0.35" />
    </svg>
  </div>

  <div class="node node-1"></div>
  <div class="node node-2"></div>

  <div class="partition dim-customers pp-n1"></div>
  <div class="partition dim-customers pp-n2"></div>
</div>

}
