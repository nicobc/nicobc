<div class="challenge-overlay" (click)="closed.emit()">
  <div
    #panel
    class="challenge-panel"
    role="dialog"
    aria-modal="true"
    aria-label="Challenge"
    (click)="$event.stopPropagation()"
    (keydown)="trapFocus($event)"
  >
    <div class="challenge-panel-header">
      <button
        class="btn-icon schema-btn"
        (click)="schemaOpen.update(v => !v)"
        [attr.aria-expanded]="schemaOpen()"
        aria-label="Toggle data model"
      >
        <span class="schema-icon-wrap">
          <fa-icon class="icon-db" [icon]="dbIcon" />
          <fa-icon class="icon-star" [icon]="starIcon" />
        </span>
      </button>
      @if (showClose) {
      <button class="btn-icon challenge-close" (click)="closed.emit()">&#x2715;</button>
      }
    </div>

    <div class="challenge-schema-inline" [class.is-open]="schemaOpen()">
      <div><app-schema-panel /></div>
    </div>

    <ng-content />
  </div>
</div>
