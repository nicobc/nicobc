<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #f4f4f6; }
    .tx { fill: #1a1b1e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1b1e; }
      .tx { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="5"/>
  <text
    class="tx"
    x="16"
    y="16"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Plus Jakarta Sans', sans-serif"
    font-weight="700"
    font-size="14"
    letter-spacing="-0.3"
  >NC</text>
</svg>
