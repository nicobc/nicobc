[project]
name = "bcn-map"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "openpyxl>=3.1.5",
    "pyproj>=3.6",
    "shapely>=2.0",
    "topojson>=1.10",
]

[project.scripts]
build-admin-geo = "bcn_map.admin_geo.main:main"
build-rental-prices = "bcn_map.rental_prices.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "pyright>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
target-version = "py311"

[tool.pyright]
exclude = [".venv/**"]
