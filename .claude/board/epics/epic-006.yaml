id: EPIC-006
title: UI/UX Audit
scope: ux
category: project
status: IN PROGRESS
description: Thorough evaluation and improvement of UI/UX across the site — layout density, interaction design, data model visibility, and copy register.
notes:
  - Copy register: about page + BCN map copy; no LLM patterns (no "not just X but Y", no triple enumerations, no dash punchlines)
  - Target audience is not beginners; no need to explain star schema, OLAP/OLTP, or basic SQL/Python
  - Schema panel uses a pre-rendered SVG; .mmd is the source of truth, mmdc CLI (dev-only) regenerates the SVG via npm run gen:schema
  - T4 (copy) should follow T1 (schema panel) so challenge schema hints can be simplified with the panel in place
tickets:

  - id: T1
    title: Schema panel — landing page switch + in-workshop sticky modal
    type: feat
    status: IN PROGRESS
    description: Learner can inspect the workshop data model at any point without it being repeated in every challenge.
    acceptance_criteria:
      - Workshop landing page has a switch toggling between cards view and data model view; no other content changes
      - Data model view renders a pre-rendered Mermaid erDiagram SVG — no runtime Mermaid JS
      - .mmd source file checked in as source of truth; npm run gen:schema script runs mmdc and writes the SVG to assets/
      - SVG inlined in the component; Mermaid ER diagram CSS classes (.er.entityBox etc.) overridden with design token variables for light/dark theming
      - All workshop step pages have a sticky button (fixed position) that opens a modal with the same ER diagram SVG
      - "@mermaid-js/mermaid-cli" added as a dev dependency only; does not appear in the production bundle
    notes:
      - mmdc pulls in Puppeteer/Chromium as a transitive dep; npm install will be heavier on dev machines — worth noting in PR description

  - id: T2
    title: SQL query output table in challenge modal
    type: feat
    status: READY
    description: As a learner, I want to see what my query actually returned after clicking Check, regardless of whether it is correct.
    acceptance_criteria:
      - After clicking Check, result rows are rendered as a table inside the challenge modal whenever the query executes without error (wrong-output and correct states)
      - wrong-sql and unsafe-sql states show no table
      - Per-step tailored wrong-output hint strings removed; replaced with a single generic message across all steps
      - correct state shows the result table alongside the success feedback
      - Result table styled consistently with the existing design system

  - id: T3
    title: Distributed computing lab — vertical density pass
    type: style
    status: READY
    description: Workshop steps fit on a 13" MacBook Pro viewport; copy-phase steps do not require scrolling to reach the CTA.
    acceptance_criteria:
      - Copy-phase steps (paragraphs + CTA button) visible without scrolling on a 13" MBP (~900px usable height)
      - Viz-phase overflow is acceptable and out of scope
      - Spacing reductions reviewed iteratively across all elements of the distributed computing lab
      - No visual regression on other lab pages (data-contracts shares global lab styles)

  - id: T4
    title: Copy pass — workshops and landing page
    type: style
    status: READY
    description: All workshop copy reads like a person wrote it; challenge schema hints simplified now that the schema panel exists.
    acceptance_criteria:
      - All lab prose, step paragraphs, challenge intros, feedback messages, and step labels reviewed and edited in distributed computing and data contracts
      - Workshop landing page copy reviewed
      - Challenge schema hint strings simplified or removed where the schema panel makes them redundant
      - No LLM copy patterns — no "not just X but Y", no triple enumerations, no dash punchlines
      - Reference register is the about page and BCN map copy
