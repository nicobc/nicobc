id: EPIC-006
title: UI/UX Audit
scope: ux
category: project
status: IN PROGRESS
description: Thorough evaluation and improvement of UI/UX across the site — layout density, interaction design, data model visibility, and copy register.
notes:
  - Copy register: about page + BCN map copy; no LLM patterns (no "not just X but Y", no triple enumerations, no dash punchlines)
  - Target audience is not beginners; no need to explain star schema, OLAP/OLTP, or basic SQL/Python
  - Schema panel is a custom Angular component — no Mermaid, no SVG file, no external diagram dependency
  - T3 (copy) precedes T10 (density): copy removal eliminates DOM elements the density pass would otherwise have to work around
  - T4 (avg→sum) precedes T5 (animation): animation uses the corrected KPI query
  - T5 (animation) precedes T9 (conclusion): conclusion renders after the animated capstone step is in place
tickets:

  - id: T1
    title: Schema panel — inline toggle on workshop pages; copyable in challenge modal
    type: feat
    status: DONE
    description: Learner can inspect the workshop data model at any point without it being repeated in every challenge.
    acceptance_criteria:
      - Workshops landing page has a toggle button in the eyebrow row that expands/collapses an inline schema panel above the workshop grid
      - Data model renders as a custom Angular component — no Mermaid, no SVG file, no external diagram library
      - 2×2 grid layout: dim_customer and dim_product on the top row, fct_order and fct_order_item on the bottom row
      - Each entity card has a header (table name + expand/collapse chevron) and a collapsible animated field list; fields collapsed by default
      - Field list shows three columns: annotation (# for PK, → for FK, blank otherwise), field name, SQL type; no nullability column
      - Relationship lines (SVG overlay) connect entity headers only; vertical positions computed once on ngAfterViewInit; lines never recalculate on expand/collapse
      - Hover on a FK field highlights the connecting line and the target entity header; hover on a PK field highlights all connecting lines and all FK entity headers pointing to it
      - All four tables include created_at TIMESTAMP and updated_at TIMESTAMP fields; seed.ts interfaces updated accordingly
      - Workshop step pages (distributed-computing, data-contracts) have a toggle button in the lab header that expands/collapses an inline schema panel; the challenge modal includes the schema panel in copyable mode (field name copy-to-clipboard)
    notes: []

  - id: T2
    title: SQL query output table in challenge modal
    type: feat
    status: DONE
    description: As a learner, I want to see what my query actually returned after clicking Check, regardless of whether it is correct.
    acceptance_criteria:
      - Challenge modal SQL editor replaced with CodeMirror (syntax highlighting, consistent with data-contracts lab)
      - After clicking Check, result rows are rendered as a table inside the challenge modal whenever the query executes without error (wrong-output, not-optimized, and correct states)
      - wrong-sql state shows the raw DuckDB error trace in a code block; no result table
      - unsafe-sql state shows no table and no error trace
      - Per-step tailored wrong-output hint strings removed; replaced with a single generic message across all steps
      - correct state shows the result table alongside the success feedback
      - Result table styled consistently with the existing design system

  - id: T3
    title: Copy pass — workshops and landing page
    type: style
    status: IN PROGRESS
    description: Workshop titles, lab header categories, and all prose updated to match the distributed computing register. Unit testing card hidden until EPIC-004 ships.
    acceptance_criteria:
      - Unit testing workshop card removed from landing page; seq numbers and scenario line updated to reflect two visible workshops
      - Workshop titles updated — data contracts to "Catching schema drift"; unit testing to "I/O isolation in pytest" (in data only, card hidden)
      - Lab header category eyebrow updated to full noun phrase without "Data Engineering" prefix — "Distributed computing", "Data contracts", "Unit testing"
      - Data contracts workshop card description updated (no "A hands-on look at" pattern)
      - All lab prose, step paragraphs, challenge intros, and feedback messages reviewed in distributed computing and data contracts
      - Broetry patterns removed: staccato fragment punchlines and em-dash payoff clauses
      - Challenge schema hint strings simplified or removed where the schema panel makes them redundant
      - No LLM copy patterns — no "not just X but Y", no triple enumerations, no dash punchlines
      - Reference register: distributed computing step paragraphs for technical prose; about page and BCN map copy for general register

  - id: T4
    title: Switch workshop KPI from average to total order amount
    type: fix
    status: DONE
    description: The shared workshop KPI used average order amount, which has no business meaning. Switch to total order amount across landing page copy and data contracts lab.
    acceptance_criteria:
      - Landing page scenario line updated from average to total order amount
      - Data contracts lab query updated from AVG to SUM(::INTEGER cast) with column renamed to total_amount
      - Data contracts expected rows recomputed for total order amount
      - Data contracts output schema, hint copy, and chart mappings updated accordingly
      - Distributed computing DB setup declares all seed columns on every table

  - id: T5
    title: Capstone step — DAG race animation for scan, shuffle, and aggregate
    type: feat
    status: TESTING
    description: As a learner, I see a side-by-side DAG race that visualises sloppy vs. optimised execution for the top 5 Spanish customers query, making the scan-to-shuffle cost reduction concrete before the capstone challenge.
    acceptance_criteria:
      - Two DAGs rendered side by side (Baseline · Optimised); each represents the top 5 Spanish customers query on dim_customers + fct_orders
      - Baseline has 7 blocks in execution order: scan × 2 → join → filter → project → aggregate → sort·limit
      - Optimised has 6 blocks: scan × 2 → join → project → aggregate → sort·limit; no filter block (predicate pushed into scan)
      - Each block fills top-to-bottom as execution proceeds; fill duration encodes relative processing time
      - Block metadata — source table and detail text (e.g. "all cols · all rows" vs "2 cols · Spanish rows") — fades in when the block activates and stays visible
      - Both DAGs race simultaneously; optimised join fills 2× faster than baseline, making the predicate-pushdown payoff visually legible
      - Scan inputs converge via SVG merge lines into the join block
      - done event emitted once baseline completes; wired to modeChange('dag-race-done') in DataMovementViz, which unlocks Next in workshop-step
      - Restart delegated to parent via public restart() method
      - New vizScenario 'dag-race' wired to step 3 in distributed-computing.ts; step 3 viz phase uses this component

  - id: T6
    title: Back navigation — step 1 to workshop landing page
    type: feat
    status: READY
    description: As a learner, I can navigate back to the workshop landing page from step 1.
    acceptance_criteria:
      - Step 1 of every workshop displays a back arrow consistent with the one shown on steps 2+
      - Clicking the back arrow from step 1 navigates to the workshop landing page
      - No other step navigation is affected

  - id: T7
    title: Challenge modal — Run, Submit, Reveal, Restart interaction model
    type: feat
    status: READY
    description: As a learner, I can freely run queries to explore results before submitting for validation, restart from the starting query at any point, and compare my solution to the canonical answer even after solving the challenge.
    acceptance_criteria:
      - Control row layout in unanswered/wrong states — [↺] [ Run ]  [ Reveal ]  [ Submit ]
      - Control row layout in correct state — [↺] [ Run ]  [ Reveal ]  [ Submit ]  [ Next ]
      - Run executes the query and displays the result table; no validation, no feedback message change
      - Submit validates the query and updates state and feedback as before (renamed from Check)
      - Restart (↺ icon, no label) resets the editor to the starting SQL and clears state and result table; available in all states including correct
      - Reveal shows the canonical solution SQL in the editor in all states including correct; does not change challenge state if already correct
      - Editor remains editable in the correct state
      - Mobile layout deferred to T11 — icon-only buttons at narrow viewports acceptable as out-of-scope here

  - id: T8
    title: Challenge info icon — how the challenge environment works
    type: feat
    status: READY
    description: A help icon on challenge components that explains on hover or click how the challenge runs — designed to extend beyond SQL editor challenges to future Spark UI challenges.
    acceptance_criteria:
      - A "?" icon is visible on each challenge component
      - On hover or click, a tooltip or popover explains how the challenge environment works (SQL challenges run in the browser on DuckDB)
      - Copy and design are extensible — the pattern must accommodate future challenge types (e.g. Spark UI) without structural changes
      - Tooltip pattern is consistent with the query-hint tooltip introduced in T3

  - id: T9
    title: Workshop conclusion — pass minimization and next workshop nudge
    type: feat
    status: READY
    description: After completing the capstone challenge, the learner sees a short conclusion that introduces pass minimization as the third lever of data movement minimization and nudges them toward the next workshop.
    acceptance_criteria:
      - Conclusion section renders after the capstone challenge is marked correct
      - Copy introduces pass minimization as the third lever — how many times the engine reads through the data
      - No forward reference to EPIC-009 until that epic is READY; conclusion copy is self-contained
      - A continue button or link prompts the learner to proceed
      - Layout and style consistent with the existing lab design
    notes:
      - Forward reference to Spark UI workshop (EPIC-009) to be added once EPIC-009 is groomed to READY

  - id: T10
    title: Distributed computing lab — vertical density pass
    type: style
    status: READY
    description: Workshop steps fit on a 13" MacBook Pro viewport; copy-phase steps do not require scrolling to reach the CTA.
    acceptance_criteria:
      - Copy-phase steps (paragraphs + CTA button) visible without scrolling on a 13" MBP (~900px usable height)
      - Viz-phase overflow is acceptable and out of scope
      - Spacing reductions reviewed iteratively across all elements of the distributed computing lab
      - No visual regression on other lab pages (data-contracts shares global lab styles)

  - id: T11
    title: Responsive design — site-wide mobile pass
    type: style
    status: READY
    description: All lab pages and the schema panel render correctly on mobile viewports; no horizontal scroll at 375px.
    acceptance_criteria:
      - Schema panel switches to a single-column stacked layout on small screens
      - Workshops landing, distributed-computing, and data-contracts pages reviewed for overflow and density on mobile
      - Challenge modal control row uses icon-only buttons on small viewports to fit the four-button layout
      - Challenge modal reviewed for usability on small viewports
      - No horizontal scroll on any page at 375px viewport width
      - Breakpoints consistent with the existing 768px threshold in global styles
