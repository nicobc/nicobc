id: EPIC-008
title: Test Coverage
scope: quality
category: quality
priority: 2
status: IN PROGRESS
description: Establish test coverage across the repo — Python pipeline tests and Angular app tests. Includes testing skill files for both stacks.

tickets:

  - id: T1
    title: Python testing skill
    type: test
    priority: 1
    status: DONE
    description: Discuss Python testing standards for the repo and produce .claude/skills/python-testing.md.
    acceptance_criteria:
      - .claude/skills/python-testing.md created; covers test location convention, fixture patterns, I/O isolation with tmp_path, what to test vs not

  - id: T2
    title: bcn-map pipeline tests
    type: test
    priority: 2
    status: DONE
    description: Write unit tests for bcn-map pipeline pure-logic functions per python-testing.md. Groom after T1.

  - id: T3
    title: Fix broken Angular specs
    type: fix
    priority: 3
    status: DONE
    description: Stale specs in app/ fail CI. app.spec.ts has a broken "should render title" test checking for a template that no longer exists.
    acceptance_criteria:
      - app.spec.ts broken "should render title" test removed
      - all remaining "should create" specs pass
      - ng test exits cleanly

  - id: T4
    title: Angular app quality pass — scoping
    type: chore
    priority: 4
    status: READY
    description: Review app/ code and test coverage; create angular-testing.md skill; groom follow-on tickets for Angular tests and any refactoring surfaced.
    acceptance_criteria:
      - angular-testing.md skill created
      - follow-on tickets groomed to READY
    notes:
      - depends on T3

  - id: T5
    title: Python code quality tools — ruff, pyright
    type: ci
    priority: 5
    status: DONE
    description: Add ruff and pyright to bcn-map pipeline dev dependencies. Set up a .pre-commit-config.yaml with ruff check, ruff format, and pyright hooks for local enforcement. Add a lint/type-check CI job to test-bcn-map-pipeline.yml that runs ruff check, ruff format --check, and pyright (no --fix, no autoformat) before the unit tests job.
    acceptance_criteria:
      - ruff, pyright added to bcn-map dev dependencies (pyproject.toml)
      - .pre-commit-config.yaml at repo root with ruff check and ruff-format hooks (astral-sh/ruff-pre-commit) and a local pyright hook (entry: uv run --directory pipelines/bcn-map pyright, language: system)
      - test-bcn-map-pipeline.yml has a lint job running ruff check, ruff format --check, pyright with no auto-fix flags
      - test job depends on lint job — CI skips tests on lint failure

  - id: T6
    title: Replace pandas with DuckDB in rental prices pipeline
    type: refactor
    priority: 6
    status: DONE
    description: Replace pandas with DuckDB for all data transformations in the rental prices pipeline. Use openpyxl directly for Excel reading. Implement wide-to-long reshape with UNION ALL and all aggregations (priciest, biggest_surge, city_avg, volatile neighborhoods) as SQL queries. Remove pandas from runtime dependencies and pandas-stubs from dev dependencies.
    acceptance_criteria:
      - pandas removed from runtime dependencies; pandas-stubs removed from dev dependencies
      - duckdb added to runtime dependencies
      - read_prices() uses openpyxl directly and returns list[list]
      - parse_prices() accepts list[list] and uses UNION ALL for wide-to-long reshape
      - all summarize() computations rewritten as DuckDB SQL queries
      - test fixtures updated to match new input types; all existing tests pass
    notes:
      - bundled with T5 in one PR (T6 removes the pandas type-stub noise that T5 would otherwise fight)
