id: EPIC-005
title: Distributed Computing Intuition Lab
scope: distributed-computing
category: workshop
status: IN PROGRESS
description: Learner maps code smells in a data pipeline to distributed computing inefficiencies; builds perf intuition beyond technique names.
notes:
  - Dataset: fct_orders + dim_customers batch1 from seed.ts; same KPI as other labs (avg order value per customer name, top 5 for Spain)
  - SQL snippets only, no runtime for animation; challenge steps use DuckDB WASM for output validation (via duckdb.ts + seed.ts); concepts apply to dbt/Snowflake, dbt/Redshift, BigQuery — not Spark-specific
  - 3 concepts: column pruning, predicate pushdown, shuffle (minimize data entering each operation)
  - Opening framing: modern engines optimize the logical plan (Catalyst in Spark; analogous in Snowflake, BigQuery, Redshift) — they reduce blast radius but don't eliminate it; understanding the model is how you read an execution plan when something is slow
  - Format per step: animated viz (toggle pill) → copy → challenge (type varies by concept: fill-in for column pruning, SQL editor for predicate pushdown and shuffle)
  - Viz: animated rectangles only, numberless; geometry (size, count) and motion carry meaning
  - Goal: mental model update, not technique recall

tickets:

  - id: T1
    title: Lab page scaffold + routing
    type: feat
    status: DONE
    description: Learner navigates to distributed computing lab and sees page structure.
    acceptance_criteria:
      - /lab/distributed-computing route renders lab component
      - lab card added to /lab landing page

  - id: T2
    title: Animated data-movement viz component
    type: feat
    status: DONE
    description: Reusable component that conveys distributed execution concepts through geometry and motion, no numbers.
    acceptance_criteria:
      - component accepts a scenario config (nodes, data blocks, movement sequences)
      - nodes rendered as positioned containers; data blocks as rectangles with configurable size and color
      - movement sequences animate data blocks traveling between nodes
      - at node boundaries data blocks morph shape (sharp corners → rounded → sharp) to represent serialize/deserialize
      - no labels, no numbers; geometry and motion are the only language
      - animation loops or triggers on step entry
      - used for all 3 concept steps
    notes:
      - gate ticket; validates the viz approach before content is built
      - column pruning scenario: wide vs narrow rectangles flowing through a scan
      - predicate pushdown scenario: many blocks reaching a late filter vs few blocks surviving an early one
      - shuffle scenario: blocks moving across node boundaries with shape morph at each crossing

  - id: T3
    title: Lab content — 3 concepts + MCQ navigation
    type: feat
    status: DISCARDED
    description: Learner works through 3 concepts; each step explains via viz then confirms via MCQ.
    acceptance_criteria:
      - opening framing note: optimizer limits + why mental model matters for profiling
      - step 1 (column pruning) — viz + copy + MCQ; snippets contrast SELECT * before join vs project to needed columns first
      - step 2 (predicate pushdown) — viz + copy + MCQ; snippets contrast WHERE late in CTE chain vs WHERE applied to source CTE
      - step 3 (shuffle) — viz + copy + MCQ; snippets contrast 1:m join before filter+agg vs filter-first-then-1:1-join; copy covers serialization as hidden shuffle cost + UDF aside
      - MCQ: correct answer unlocks Next; incorrect answer shows explanation and allows retry without penalty
      - back arrow visible from step 2+; step 3 is terminal
    notes:
      - split into T4 (column pruning), T5 (predicate pushdown), T6 (shuffle)

  - id: T4
    title: Column pruning — animation + copy + challenge
    type: feat
    status: DONE
    description: Learner sees the cost of a full column scan vs a pruned scan, then validates understanding via a fill-in challenge.
    acceptance_criteria:
      - animation toggle pill (SELECT * / SELECT customer_id, customer_name + FROM dim_customers label) switches between unpruned (full-width blocks travel and rest at full width) and pruned (narrow blocks throughout); auto-replays on switch
      - step 1 split into viz phase and copy phase; step indicator reads "1 / 3 — Column pruning"
      - viz phase: Next button appears (right of centered Replay) only after learner has selected the pruned mode at least once
      - copy phase: 2 paragraphs covering SELECT * scan cost and OLAP engine projection pushdown; "Back to animation" left, "Test your understanding" right
      - challenge: modal overlay with blurred background; single CTE query (dim_products + fct_order_items); learner fills a text input replacing the column list in the first CTE; dim_products schema shown
      - validation: case-insensitive, whitespace-normalized, order-agnostic set comparison; expected product_id, category
      - wrong: "Not quite." + explanation, retry without closing; reveal solution populates input and transitions to correct state
      - correct: success feedback + Next → advances to step 2 and closes panel
      - inline code styled globally with theme-aware background (--code-bg CSS variable)
    notes:
      - opening framing (optimizer limits + why mental model matters) lives in this step as it is the first concept
      - challenge is decoupled from MAINT/T5; uses dim_products + fct_order_items, not the workshop scenario tables

  - id: T5
    title: Predicate pushdown — animation + copy + challenge
    type: feat
    status: DONE
    description: Learner sees the cost of a late filter vs an early one, then proves understanding by correctly splitting pushable from non-pushable predicates in a SQL editor challenge.
    acceptance_criteria:
      - toggle pill shows two truncated KPI query snippets — "filter late" (WHERE country = 'Spain' at top level, after join) vs "filter early" (WHERE country = 'Spain' inside source CTE); animation responds accordingly; auto-replays on switch
      - animation: "filter late" — full-height dim_customers rectangle flows to join, horizontal slice occurs after; "filter early" — rectangle slices immediately (French rows removed), reduced block flows through; no nodes, no morphing
      - step indicator reads "2 / 3 — Predicate pushdown"
      - viz phase: Next appears only after learner has selected "filter early" at least once
      - copy phase: 2 paragraphs — row volume cost of a late filter; optimizer caveat (engines push predicates but not reliably across CTE boundaries — explicit placement matters); "Back to animation" left, challenge CTA right
      - challenge: modal overlay, blurred background; full query editable; dim_products schema shown
      - challenge query uses dim_products + fct_order_items; goal is top non-food categories by items sold; starting state has a single HAVING clause with two predicates — COUNT(*) >= N AND category != 'Food'
      - correct answer: WHERE category != 'Food' pushed into the dim_products source CTE; HAVING COUNT(*) >= N kept after GROUP BY
      - validation layer 1 (AST, JS SQL parser): category predicate is a WHERE inside the source CTE AND count predicate remains as HAVING
      - validation layer 2 (DuckDB WASM, via duckdb.ts + seed.ts): executes query and compares output to expected result set
      - both predicates left in HAVING → "one of these doesn't depend on grouped values — which one can be evaluated before aggregation?"
      - both predicates pushed to WHERE → SQL error on COUNT(*) → "one of these can only be evaluated after grouping"
      - category in HAVING, count in WHERE → SQL error + "think about which filter references an aggregated value"
      - structure correct, wrong output → hint addresses filter value or threshold
      - reveal populates correct query; correct (structure + output) → success + Next → step 3
    notes:
      - depends on T2 (animated viz component)
      - the two-predicate HAVING is intentional — challenge requires learner to distinguish pushable (category != 'Food') from non-pushable (COUNT(*) >= N), not just "move everything to WHERE"
      - DuckDB wiring uses existing app/src/app/labs/db/duckdb.ts and app/src/app/labs/data/seed.ts

  - id: T6
    title: Shuffle — animation + copy + challenge
    type: feat
    status: IN PROGRESS
    description: Learner sees how shuffle cost scales with data volume entering an operation, then proves understanding by rewriting a 3-table query to minimize data shuffled at each step.
    acceptance_criteria:
      - toggle pill shows two approaches to the throughline query ("GROUP BY first" / "join first"); animation responds accordingly; auto-replays on switch
      - "GROUP BY first" animation: full dim_customers and full fct_orders blocks flow toward the GROUP BY node — wide, numerous rectangles
      - "join first" animation: Spain-filtered dim_customers (narrow, few blocks) joins fct_orders first, reducing it; smaller block set flows to GROUP BY node
      - no shape morphing; geometry (size, count) carries meaning; no node-boundary effects
      - step indicator reads "3 / 3 — Shuffle"
      - viz phase: Next appears only after learner has toggled to "join first" at least once
      - copy phase: 2 paragraphs — (1) shuffle cost has two levers: data volume entering each operation (illustrated by animation) and number of shuffle operations in the query; (2) optimizer caveat (engines may broadcast small dimension tables; principle extends to fact-to-fact joins and high-cardinality GROUP BY where broadcast is not viable); "Back to animation" left, challenge CTA right
      - challenge: modal overlay, blurred background; 3-table query over fct_orders + dim_customers + fct_order_items; goal is top 5 Spanish customers by total items ordered
      - challenge intro states the 1:m cardinality relationship (1 order = multiple items) so relative table sizes are established without numbers
      - starting query has suboptimal ordering — GROUP BY customer_id on fct_orders before joining dim_customers, then fct_order_items
      - correct answer: filter and prune dim_customers to Spain (customer_id, customer_name only) first, join fct_orders, join fct_order_items, GROUP BY customer_name; requires applying column pruning (step 1) and predicate pushdown (step 2) alongside correct join ordering
      - fct_order_items added to seed.ts: schema order_id, product_id, quantity; multiple rows per order_id; 1:m ratio documented in seed comment
      - validation: (1) run query on DuckDB WASM — surface SQL errors immediately; (2) AST check — verify join ordering and predicate placement are optimal; (3) compare DuckDB output to expected result set; hints and feedback keyed to which layer fails
      - reveal populates correct query; correct → success; terminal step (no Next)
    notes:
      - no serialization content; no UDF content; no shape morphing
      - broadcasting acknowledged in copy as one engine mechanism, not the lesson — copy leads with the general principle
      - challenge is a capstone: correct solution requires column pruning, predicate pushdown, and shuffle ordering applied together
      - distractor logic: GROUP BY fct_orders on customer_id first is logically valid (1 id = 1 name) but misses that joining dim_customers first is nearly free and enables filtering fct_orders before the GROUP BY shuffle
      - 3 shuffles (dim_customers join, fct_order_items join, GROUP BY) prevent answer-by-elimination; learner must reason about ordering, not pick from two options
      - depends on T2 (animated viz component)

  - id: T7
    title: Workshop landing page + lab grid refactor
    type: feat
    status: DONE
    description: Learner lands on a workshop landing page that introduces the through-line scenario before entering any individual lab; the lab grid reflects the new structure.
    acceptance_criteria:
