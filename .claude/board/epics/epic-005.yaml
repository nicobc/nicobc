      - lab grid replaces individual workshop cards with a single Workshop Series card routing to /lab/workshops
      - lab grid layout updated — two cards (Workshop Series + BCN Map), same size, centered
      - category labels on all lab grid cards use type only — Workshop / Project — no domain suffix
      - CLAUDE.md updated with data-to-ink ratio principle (one line)
    notes:
      - depends on MAINT/T5 for scenario copy (country filter, company names)
