id: EPIC-007
title: Deployment
scope: deployment
category: infra
status: DONE
description: Ship the portfolio to a live URL. Vercel hosts the Angular SPA; Cloudflare R2 serves generated data assets. Production deploys are triggered by pushing a CalVer tag (YYYY.MM.N) — the tag is the deploy decision. Data pipeline runs independently on manual dispatch.

tickets:

  - id: T1
    title: Commit seeds.ts
    type: chore
    status: DONE
    description: Seed data is now visible after gitignore fix; commit it.
    acceptance_criteria:
      - app/src/app/labs/data/seed.ts committed and tracked in git

  - id: T2
    title: Remove cadastral ownership artifacts
    type: chore
    status: DONE
    description: Cadastral metrics were dropped; remove all remaining traces from the repo.
    acceptance_criteria:
      - app/public/data/cadastral-ownership.json symlink removed from git

  - id: T3
    title: R2 bucket + data upload
    type: chore
    status: DONE
    description: Establish R2 as the authoritative source for generated data assets.
    acceptance_criteria:
      - R2 bucket created with public access enabled
      - CORS configured to allow requests from app domain and localhost
      - bcn-admin.geojson, rental-prices.json, rental-insights.json uploaded and accessible via custom domain (see T8)
      - bcn-admin.geojson symlink removed from git
    notes:
      - run build-admin-geo and build-rental-prices locally before uploading to confirm outputs are current
      - r2.dev public URL is non-functional; custom domain (T8) is the delivery mechanism

  - id: T8
    title: Buy domain + connect to Cloudflare
    type: chore
    status: DONE
    description: Buy a domain via Cloudflare Registrar and wire it up for both R2 and Vercel.
    acceptance_criteria:
      - domain purchased via Cloudflare Registrar
      - data subdomain (e.g. data.yourdomain.dev) connected to R2 bucket as custom domain
      - environment.prod.ts updated with new data subdomain URL instead of r2.dev
      - root domain reserved for Vercel (T6)

  - id: T4
    title: Environment-aware data URL
    type: feat
    status: DONE
    description: Angular app fetches data from R2 in production and from local public/data/ in development.
    acceptance_criteria:
      - a single base URL constant controls all data fetches in bcn-map
      - development builds read from /data/ (local public/ dir)
      - production builds read from R2 public URL via environment configuration
      - bcn-map lab loads correctly in both environments

  - id: T5
    title: GitHub Actions PR CI
    type: ci
    status: DONE
    description: Path-filtered PR validation using a changes-detection job; each concern tested only when its code changes. Gate job pattern ensures required status checks always report a result.
    acceptance_criteria:
      - app-ci.yml and pipelines-ci.yml deleted; replaced by test-app.yml and test-bcn-map-pipeline.yml
      - deploy.yml renamed to deploy-app.yml; bcn-map-pipeline.yml renamed to run-bcn-map-pipeline.yml
      - both test workflows trigger on all PRs targeting main; path detection via dorny/paths-filter in a changes job; real CI only runs when relevant files changed
      - test-bcn-map-pipeline.yml runs uv run pytest with working-directory pipelines/bcn-map
      - both workflows include a status gate job (if always()) that passes on success/skipped, fails on failure/cancelled
      - Test App / status and Test BCN Map Pipeline / status listed as required checks in branch protection
    notes:
      - bcn-map has no tests yet; test-bcn-map-pipeline.yml will collect none until EPIC-008/T2 lands; workflow structure is in place

  - id: T6
    title: Cloudflare Pages config + deploy workflow
    type: feat
    status: DONE
    description: Configure Cloudflare Pages and ship the first production deploy triggered by a CalVer tag push.
    acceptance_criteria:
      - _redirects file defines SPA rewrite (all paths → index.html)
      - Cloudflare Pages project created and connected to GitHub repo
      - auto-deploy from branch disabled; production deploys triggered by deploy.yml on CalVer tag push via wrangler pages deploy
      - PR builds generate Pages preview URLs
      - app loads at nicolascontreras.dev; bcn-map loads from R2; data-contracts lab runs DuckDB queries successfully

  - id: T7
    title: Rental prices pipeline workflow
    type: ci
    status: DONE
    description: Run the rental prices pipeline and upload outputs to R2 via manual workflow dispatch; target bucket inferred from git ref.
    acceptance_criteria:
      - bcn-rental-prices-pipeline.yml workflow_dispatch curls source Excel to the path build-rental-prices expects, then runs the pipeline
      - curl failure (non-200, missing file) aborts the workflow explicitly before the pipeline runs
      - ref is a tag → uploads to nicobc-prd-r2b; ref is a branch → uploads to nicobc-dev-r2b
      - build-admin-geo excluded (static data; run locally once)
      - upload fails fast if R2 credentials are missing or bucket is unreachable
    notes:
      - source URL: https://habitatge.gencat.cat/web/.content/home/dades/estadistiques/01_Estadistiques_de_construccio_i_mercat_immobiliari/03_Mercat_de_lloguer/03_Lloguers_Barcelona_per_districtes_i_barris/anual_bcn_lloguer_m2.xlsx
      - depends on T9 (buckets must exist before workflow can be tested)

  - id: T9
    title: Migrate R2 buckets to naming convention
    type: chore
    status: DONE
    description: Rename prod bucket to nicobc-prd-r2b and create dev bucket nicobc-dev-r2b.
    acceptance_criteria:
      - nicobc-prd-r2b bucket created; files migrated from nicobc-data; custom domain data.nicolascontreras.dev re-pointed
      - nicobc-data bucket deleted
      - nicobc-dev-r2b bucket created; public access enabled
      - dev R2 CORS configured to allow *.nicobc.pages.dev and localhost (prereq for T10)
      - environment.prod.ts dataBaseUrl confirmed still working after migration

  - id: T10
    title: Self-contained dev environment on Cloudflare Pages
    type: chore
    status: DONE
    description: Wire up a fully isolated dev environment — preview builds on *.nicobc.pages.dev read from nicobc-dev-r2b via data.dev.nicolascontreras.dev. No-tag pushes use the dev Angular config; CalVer tag pushes use production.
    acceptance_criteria:
      - data.dev.nicolascontreras.dev custom domain connected to nicobc-dev-r2b
      - environment.dev.ts created with dataBaseUrl pointing to data.dev.nicolascontreras.dev/bcn
      - angular.json dev build configuration added with fileReplacements swapping in environment.dev.ts
      - Cloudflare Pages preview build command uses --configuration=dev
      - preview deployments re-enabled for non-production branches
      - dev branch deploys to dev.nicobc.pages.dev on push; bcn-map loads from data.dev.nicolascontreras.dev
    notes:
      - depends on T9 (public access and CORS on nicobc-dev-r2b must be set before enabling previews)
      - nicobc-dev-r2b has no data until T7 pipeline runs from a branch; bcn-map will 404 until then

  - id: T11
    title: Update dorny/paths-filter to Node 24 compatible version
    type: chore
    status: DONE
    description: dorny/paths-filter@v3 runs on Node.js 20, which GitHub Actions forces to Node.js 24 on 2026-06-02. Update before that date or CI will break.
    acceptance_criteria:
      - dorny/paths-filter pinned to a version that supports Node.js 24 in both test-app.yml and test-bcn-map-pipeline.yml
      - both status gate checks still pass on a PR after the update
    notes:
      - deadline 2026-06-02; check dorny/paths-filter releases for a Node 24 compatible tag
