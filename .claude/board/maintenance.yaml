tickets:

  - id: T1
    title: Scrollbar + padding scroll fix
    type: fix
    scope: ui
    status: DONE
    description: Scrollbar should sit at viewport edge, not at far right of horizontal overflow.
    resolution: >
      All pages render inside main (max-width: 860px, margin: 0 auto). No page container
      causes viewport-level horizontal overflow. Data-contracts code blocks use overflow-x: auto,
      scoping their scrollbar to the element. BCN map uses negative margins (intentional bleed),
      not viewport overflow. Fix is already in place across all pages.
    notes:
      - Pattern for new labs with wide content: overflow-x auto on the element, not the page container

  - id: T2
    title: Data contracts lab light theme visual bugs
    type: fix
    scope: data-contracts
    status: DONE
    description: Several elements in the dc lab are invisible or low-contrast in light theme.
    acceptance_criteria:
      - chart colors adapt to theme (visible in both light and dark)
      - all code snippet frames (step 2 snippet and JSON schema block) have sufficient contrast in both themes
      - DAG borders visible in light theme
      - Run/Next/etc. buttons have sufficient contrast as CTAs in light mode

  - id: T3
    title: Data contracts lab copy — define contracts and frame JSON schema
    type: fix
    scope: data-contracts
    status: DONE
    description: The narrative jumps from "stakeholder would freak out" to a fake error and a JSON schema with no bridging explanation. Reader has no context for what a data contract is or why JSON schema specifically.
    acceptance_criteria:
      - data contracts defined (what they are, the problem they solve) before the example
      - copy acknowledges multiple formats exist (Great Expectations, dbt contracts, JSON schema, etc.)
      - JSON schema example introduced explicitly as one approach
      - flow reads coherently from incident to concept to concrete example

  - id: T4
    title: Scope Cloudflare preview builds to app/
    type: ci
    scope: deployment
    status: DONE
    description: Replace native Cloudflare Pages GitHub integration with a GHA workflow that triggers only on app/ changes. Eliminates spurious preview builds on .claude/ and .md-only PRs.
    acceptance_criteria:
      - deploy-app.yml gains workflow_dispatch trigger
      - guard step fails with clear message if dispatched from main
      - deploy step uses --branch=main on tag push, --branch=${{ github.ref_name }} on manual dispatch
      - Create GitHub release step gated to tag push events only
      - native Cloudflare Pages GitHub integration disabled in CF dashboard (manual step)
    notes:
      - uses CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID already present in GHA secrets
      - native integration must be disabled in CF dashboard after workflow is verified working

  - id: T5
    title: Replace year filter with country filter in workshop through-line scenario
    type: refactor
    scope: labs
    status: DONE
    description: The KPI query filters by YEAR(order_date) = 2026, which is arbitrary and adds noise to labs that are not about date handling. Replace with WHERE country = 'Spain' — geographically coherent with the BCN map, semantically intuitive, and keeps order_date on fct_orders as an intentionally unused column for the column pruning illustration. Scenario framing: Spanish e-commerce company expanding to France; KPI targets the Spanish market.
    acceptance_criteria:
      - dim_customers seed data gains a country column; ~4-5 customers from France, rest from Spain
      - French customers rank below the Spanish top 5 in the unfiltered dataset (realistic — new market, shorter order history)
      - customer names replaced with realistic fictional Spanish company names (e.g. Grupo Valera, Distribuciones Casas); French customers follow the same pattern (e.g. Maison Dupont, Atelier Laurent)
      - data contracts lab skeleton and solution queries updated — year filter replaced with WHERE d.country = 'Spain'
      - data contracts lab expected top 5 re-derived and validated against updated seed
      - EPIC-004 notes updated — KPI filter and expected values updated to match new seed
      - EPIC-005 notes updated — KPI filter updated
      - workshop landing page copy includes "Any resemblance to actual companies or persons is purely coincidental"
    notes:
      - order_date stays on fct_orders — intentionally unused, clean extra-column example for column pruning

  - id: T6
    title: Data contracts lab — two-tier output validation
    type: feat
    scope: data-contracts
    status: DONE
    description: Step 1 currently validates query output loosely. Replace with two explicit tiers — JSON schema for output structure, expected output for business logic — so feedback is precise and mirrors the contract concept the lab teaches.
    acceptance_criteria:
      - JSON schema defined for expected output (column names and types); schema failure shows current error behaviour
      - expected output defined as exact match fixture (top 5 rows, post-T5 values)
      - schema pass + exact match → chart renders, Next unlocks
      - schema pass + mismatch → hint shown ("check your filter or aggregation"), Next stays locked
      - schema fail → existing error behaviour unchanged
