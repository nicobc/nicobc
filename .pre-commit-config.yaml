repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: format-app
        name: format app (prettier + stylelint)
        entry: npm --prefix app run format
        language: system
        files: ^app/src/.*\.(ts|html|scss)$
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run --directory pipelines/bcn-map pyright
        language: system
        types: [python]
        pass_filenames: false
