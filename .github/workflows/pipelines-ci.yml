name: Pipelines CI

on:
  pull_request:
    branches: [main]
    paths: ['pipelines/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
